[project]
name = "fargisguard"
version = "0.2.0"
description = "AI-assisted trust & safety bot for Discord communities"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "docs", ".clauderizer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
